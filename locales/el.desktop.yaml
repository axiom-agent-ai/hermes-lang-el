      useRealProfile: "Η τοπική περιήγηση χρησιμοποιεί τα πραγματικά σας login. Το Hermes αντιγράφει το προεπιλεγμένο προφίλ του browser σας (cookies, συνδέσεις, προτιμήσεις) σε ένα διαχειριζόμενο snapshot και το οδηγεί με το ενσωματωμένο Chromium — το ζωντανό προφίλ δεν ανοίγει ποτέ απευθείας και το αντίγραφο ανανεώνεται από αυτό σε κάθε εκτέλεση. Επιτρέπει επίσης στον agent να ανοίξει τοπική συνεδρία με πραγματικό προφίλ κατόπιν αιτήματος, ακόμα κι όταν έχει ρυθμιστεί cloud browser backend. Υποστηρίζονται μόνο browsers Chromium (Chrome, Edge, Brave, Brave Origin, Chromium)· ένα προεπιλεγμένο browser εκτός Chromium αποτυγχάνει με σαφές μήνυμα. Απενεργοποιημένο από προεπιλογή."
